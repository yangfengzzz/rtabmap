# RTAB-Map -> PCT tomogram export defaults.
#
# These are intentionally much closer to the upstream PCT building scenes than
# the first draft config, and they avoid assuming the input cloud's Z=0 already
# corresponds to the lowest floor.

map:
  resolution: 0.1
  ground_h: auto
  slice_dh: 0.5
  export_dir: data/tomography/exports

trav:
  kernel_size: 7
  interval_min: 0.5
  interval_free: 0.65
  slope_max: 0.4
  step_max: 0.17
  standable_ratio: 0.2
  cost_barrier: 50.0
  safe_margin: 0.4
  inflation: 0.2

runtime:
  benchmark_repeats: 0
